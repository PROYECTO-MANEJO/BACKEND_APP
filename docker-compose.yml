services:
  postgres:
    image: postgres:15-alpine
    container_name: appeventos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: appeventos_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appeventos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
